        <!--Building a Blackjack game-->
        <div class="card blackjack-board" hidden>
            <h1 class="blackjack-title">Blackjack</h1>
            <p id="greeting-el"></p>
            <p id="message-el">Want to play a round</p>
            <p id="cards-el">Cards:</p>
            <p id="sum-el">Sum:</p>
            <button type="button" class="blackjack-btn" onclick="startGame()">
                Start Game
            </button>
            <button type="button" class="blackjack-btn" onclick="newCard()">
                New Card
            </button>
            <p id="player-el"></p>
        </div>

        <!--practice2 section-->
        <div hidden>
            <h1>Bingo Game</h1>
            <p style="font-size: 50px; margin-bottom: 20px" id="stage">
                ❓ ❓ ❓
            </p>
            <div id="bingo-celeb"></div>
            <button type="button" id="bingoButton">Pick Your Luck!</button>
        </div>
        <div hidden>
            <h1
                style="
                    background-color: orange;
                    padding: 5px;
                    border-radius: 10px;
                "
                id="orange-shelf"
            ></h1>
            <h1
                style="background-color: red; padding: 5px; border-radius: 10px"
                id="apple-shelf"
            ></h1>
        </div>

        <!--Build a Chrome Extension-->
        <div>
            <input type="text" id="input-el">
            <button type="submit" id="input-btn">Save Input</button>
            <ul id="ul-el"></ul>
        </div>
